<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riftbound KR Prices</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Riftbound KR Prices</h1>
      <p class="meta" id="meta"></p>
      <button class="lang" id="lang" type="button"></button>
    </div>
    <div class="controls">
      <input id="q" type="search" autocomplete="off" autofocus>
      <select id="set"><option value="" data-i18n="allSets"></option></select>
      <select id="rarity"><option value="" data-i18n="allRarities"></option></select>
      <select id="type"><option value="" data-i18n="allTypes"></option></select>
      <select id="sort">
        <option value="code" data-i18n="sortCode"></option>
        <option value="price_desc" data-i18n="sortPriceDesc"></option>
        <option value="price_asc" data-i18n="sortPriceAsc"></option>
        <option value="listings" data-i18n="sortListings"></option>
        <option value="name" data-i18n="sortName"></option>
      </select>
      <label class="check"><input id="priced" type="checkbox"> <span data-i18n="pricedOnly"></span></label>
    </div>
  </header>

  <main>
    <div class="ad" id="ad-top"></div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <div id="sentinel"></div>
  </main>

  <dialog id="detail">
    <button class="close" id="close">×</button>
    <div id="detail-body"></div>
  </dialog>

  <script src="data/cards.js"></script>
  <script src="data/prices.js"></script>
  <script src="app.js"></script>
  <script src="ads.js"></script>
</body>
</html>
