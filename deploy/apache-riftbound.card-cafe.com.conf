# Riftbound KR Prices: a static site served straight from disk.
# Installed by deploy/server-setup.sh; certbot copies this into the -le-ssl.conf
# (HTTPS) site and turns this one into a redirect.
<VirtualHost *:80>
    ServerName riftbound.card-cafe.com
    DocumentRoot /srv/riftbound/site

    ErrorLog ${APACHE_LOG_DIR}/riftbound-error.log
    CustomLog ${APACHE_LOG_DIR}/riftbound-access.log combined

    <Directory /srv/riftbound/site>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # The data builders live next to the site (they write into it); don't serve them.
    <LocationMatch "^/(scripts|deploy)/|^/README\.md$|^/\.">
        Require all denied
    </LocationMatch>

    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript
    # Prices change every few hours: browsers must revalidate. Card images never change.
    <LocationMatch "^/(data/|index\.html$|app\.js$|style\.css$|ads\.js$|$)">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    <LocationMatch "^/img/">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>
</VirtualHost>
